<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Catcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
  /* Layout: full-screen canvas game, a floating question bubble on top, chunky cards for menus */
  :root {
    --space: #0d1748;
    --space-2: #1d2c74;
    --ink: #ffffff;
    --sun: #ffd23f;
    --pink: #ff6fae;
    --mint: #3ee0c4;
    --card: #fff8e7;
    --card-ink: #2a2160;
    --font: "Fredoka", "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--space); color: var(--ink);
    font-family: var(--font);
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font-family: var(--font); }
  button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- In-game HUD ---------- */
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 60px; }
  .qwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .question {
    background: var(--card); color: var(--card-ink);
    border-radius: 999px; padding: 6px 26px;
    font-size: clamp(30px, 7vw, 56px); font-weight: 700; line-height: 1.2;
    box-shadow: 0 6px 0 rgba(0,0,0,.28);
    white-space: nowrap;
  }
  .progress { font-size: clamp(16px, 3.4vw, 22px); font-weight: 600; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.25); }
  .dots i.done { background: var(--sun); }
  .dots i.now { background: var(--mint); transform: scale(1.25); }
  .score {
    display: flex; align-items: center; gap: 4px;
    font-size: 24px; font-weight: 700; color: var(--sun);
    text-shadow: 0 2px 0 rgba(0,0,0,.4);
  }
  .iconbtn {
    width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--space-2); color: var(--ink);
    display: grid; place-items: center;
    box-shadow: 0 4px 0 rgba(0,0,0,.4);
  }
  .iconbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .iconbtn svg { width: 28px; height: 28px; }

  .pads {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; pointer-events: none;
  }
  .pad {
    pointer-events: auto; cursor: pointer;
    width: 84px; height: 84px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.55); background: rgba(255,255,255,.14);
    color: #fff; display: grid; place-items: center;
  }
  .pad svg { width: 40px; height: 40px; }
  .pad.held { background: rgba(255,210,63,.45); }
  @media (hover: hover) and (pointer: fine) { .pads { display: none; } }

  /* ---------- Menus ---------- */
  .overlay {
    position: fixed; inset: 0; overflow: auto;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
    background: rgba(8, 12, 40, .5);
    touch-action: auto;
  }
  .card {
    width: 100%; max-width: 520px; margin: auto;
    background: var(--card); color: var(--card-ink);
    border-radius: 36px; padding: 28px 22px 24px;
    text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.3);
  }
  h1 { margin: 0; font-size: clamp(40px, 10vw, 60px); line-height: 1; text-wrap: balance; }
  h1 span { color: var(--pink); }
  h2 { margin: 0; font-size: clamp(32px, 8vw, 44px); line-height: 1.1; text-wrap: balance; }
  .lead { font-size: 20px; margin: 10px 0 18px; }
  .levels { display: grid; gap: 14px; }
  .big {
    width: 100%; min-height: 72px; border: none; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; gap: 14px; padding: 8px 12px 8px 10px;
    color: #fff; font-size: 26px; font-weight: 700; text-align: left;
    box-shadow: 0 6px 0 rgba(0,0,0,.25);
  }
  .big:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .big .badge {
    flex: none; min-width: 74px; height: 54px; padding: 0 10px; border-radius: 999px;
    background: rgba(255,255,255,.95); color: var(--card-ink);
    display: grid; place-items: center; font-size: 22px;
  }
  .big .txt { display: flex; flex-direction: column; line-height: 1.1; }
  .big small { font-size: 16px; font-weight: 600; opacity: .95; }
  .easy { background: #20a866; }
  .medium { background: #ef8a14; }
  .hard { background: #e0457a; }
  .plain { background: #4b3fb8; justify-content: center; text-align: center; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .row .big { justify-content: center; font-size: 22px; padding: 8px; }
  .row .big svg { width: 30px; height: 30px; flex: none; }
  .stars { display: flex; justify-content: center; gap: 10px; margin: 14px 0 6px; }
  .stars svg { width: 76px; height: 76px; }
  .result { font-size: 24px; margin: 6px 0 2px; }
  .best { font-size: 20px; color: #d6336c; font-weight: 700; min-height: 1.2em; }
  .tip { font-size: 15px; opacity: .75; margin-top: 16px; }
  @media (prefers-reduced-motion: no-preference) {
    .pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Star Catcher game area"></canvas>

<!-- In-game HUD -->
<div class="hud" id="hud" hidden>
  <div class="side">
    <button class="iconbtn" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="2"/><rect x="14" y="4" width="5" height="16" rx="2"/></svg>
    </button>
  </div>
  <div class="qwrap">
    <div class="question" id="question" aria-live="polite">3 + 4 = ?</div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="progress" id="progress">Question 1 of 10</div>
  </div>
  <div class="side">
    <button class="iconbtn" id="muteBtn" aria-label="Sound on. Tap to mute"></button>
    <div class="score" aria-label="Score">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="#ffd23f"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z"/></svg>
      <span id="score">0</span>
    </div>
  </div>
</div>

<div class="pads" id="pads" hidden>
  <button class="pad" id="leftPad" aria-label="Move left">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="pad" id="rightPad" aria-label="Move right">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<!-- Start screen -->
<div class="overlay" id="menu">
  <div class="card pop">
    <h1>Star <span>Catcher</span></h1>
    <p class="lead">Fly your rocket and catch the star with the right answer!</p>
    <div class="levels">
      <button class="big easy" data-level="easy">
        <span class="badge">2+3</span>
        <span class="txt">Easy<small>Adding up to 10 · <span data-best="easy">Best: 0</span></small></span>
      </button>
      <button class="big medium" data-level="medium">
        <span class="badge">9−4</span>
        <span class="txt">Medium<small>Add and take away to 20 · <span data-best="medium">Best: 0</span></small></span>
      </button>
      <button class="big hard" data-level="hard">
        <span class="badge">3×4</span>
        <span class="txt">Hard<small>Add, take away, times · <span data-best="hard">Best: 0</span></small></span>
      </button>
    </div>
    <p class="tip">Move with the arrow keys, your mouse, or your finger.</p>
    <button class="tip" id="homeBtn" style="background:none;border:none;color:inherit;text-decoration:underline;cursor:pointer;font-size:16px;padding:8px">All games</button>
  </div>
</div>

<!-- Pause screen -->
<div class="overlay" id="pauseScreen" hidden>
  <div class="card pop">
    <h2>Paused</h2>
    <p class="lead">Take a break. The stars will wait for you!</p>
    <button class="big plain" id="resumeBtn">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg> Keep playing
    </button>
    <button class="big plain" id="quitBtn" style="background:#8a86a8">Back to levels</button>
  </div>
</div>

<!-- End of round -->
<div class="overlay" id="endScreen" hidden>
  <div class="card pop">
    <h2 id="endTitle">You did it!</h2>
    <div class="stars" id="endStars" aria-hidden="true"></div>
    <p class="result" id="endScore">You scored 80 points</p>
    <p class="best" id="endBest"></p>
    <div class="row">
      <button class="big easy" id="againBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg> Play again
      </button>
      <button class="big plain" id="levelBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg> Levels
      </button>
    </div>
  </div>
</div>

<script>
/* =============================================================
   STAR CATCHER — a math catching game for ages 5–8
   Change the settings below to tune the game.
   ============================================================= */
const CONFIG = {
  questionsPerRound: 10,
  starsAtOnce: { easy: 3, medium: 3, hard: 4 },
  fallSpeed: 0.085,          // how fast stars fall (screen heights per second) at the start
  speedUpPerQuestion: 0.05,  // each question is 5% faster than the one before
  rocketSpeed: 0.9,          // rocket speed with keys / buttons (screen widths per second)
  pointsFirstTry: 10,        // points for catching the right star first time
  pointsLater: 5,            // points when it took more than one try
  starColors: ['#ffd23f', '#ff8fc4', '#5ff0d4', '#b4a8ff'],
  cheers: ['Great job!', "You're a star!", 'Super!', 'Wow!', 'Amazing!', 'Yes!'],
  oops: ['Oops, try again!', 'Almost! Try again!', 'Not that one!'],
};

/* ---------- Setup ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0, unit = 0;
const state = {
  screen: 'menu',            // menu | play | paused | end
  level: 'easy',
  q: 0,                      // index of the current question
  score: 0,
  triesThisQ: 0,
  question: null,
  stars: [],
  particles: [],
  messages: [],
  rocketX: 0.5,
  targetX: null,
  keyDir: 0,
  padDir: 0,
  wobble: 0,
  nextAt: 0,                 // time when the next question appears
  muted: false,
  time: 0,
};

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  unit = Math.min(W, H * 0.8) / 10;
}
window.addEventListener('resize', resize);
resize();

/* ---------- Storage (safe if blocked) ---------- */
function loadBest(level) {
  try { return parseInt(localStorage.getItem('starCatcher.best.' + level), 10) || 0; } catch (e) { return 0; }
}
function saveBest(level, score) {
  try { localStorage.setItem('starCatcher.best.' + level, String(score)); } catch (e) { /* storage blocked: ignore */ }
}
function refreshBestLabels() {
  document.querySelectorAll('[data-best]').forEach(el => { el.textContent = 'Best: ' + loadBest(el.dataset.best); });
}

/* ---------- Sound (Web Audio, no files) ---------- */
let audioCtx = null;
function audio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type = 'sine', vol = 0.18, delay = 0, slideTo = null) {
  if (state.muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  ding()    { tone(880, 0.25, 'triangle'); tone(1318, 0.35, 'triangle', 0.14, 0.09); },
  boop()    { tone(320, 0.3, 'sine', 0.16, 0, 170); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.6 : 0.2, 'triangle', 0.16, i * 0.15)); },
  tap()     { tone(600, 0.08, 'sine', 0.08); },
};

const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
function setMuted(m) {
  state.muted = m;
  $('muteBtn').innerHTML = m ? ICON_SOUND_OFF : ICON_SOUND_ON;
  $('muteBtn').setAttribute('aria-label', m ? 'Sound off. Tap to turn on' : 'Sound on. Tap to mute');
  try { localStorage.setItem('starCatcher.muted', m ? '1' : '0'); } catch (e) {}
}
try { setMuted(localStorage.getItem('starCatcher.muted') === '1'); } catch (e) { setMuted(false); }

/* ---------- Questions ---------- */
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

function makeQuestion(level) {
  let a, b, op;
  if (level === 'easy') {
    a = rand(0, 9); b = rand(1, 10 - a); op = '+';
  } else if (level === 'medium') {
    if (Math.random() < 0.5) { a = rand(2, 15); b = rand(1, 20 - a); op = '+'; }
    else { a = rand(5, 20); b = rand(1, a); op = '−'; }
  } else {
    const r = Math.random();
    if (r < 0.45) { a = rand(1, 5); b = rand(1, 5); op = '×'; }
    else if (r < 0.75) { a = rand(3, 15); b = rand(2, 20 - a); op = '+'; }
    else { a = rand(8, 20); b = rand(2, a); op = '−'; }
  }
  const answer = op === '+' ? a + b : op === '−' ? a - b : a * b;
  return { text: `${a} ${op} ${b} = ?`, answer };
}

// Wrong answers that are close to the right one, never negative
function wrongAnswers(answer, n) {
  const set = new Set();
  let guard = 0;
  while (set.size < n && guard++ < 200) {
    const v = answer + rand(1, 3) * (Math.random() < 0.5 ? -1 : 1);
    if (v >= 0 && v !== answer) set.add(v);
  }
  let extra = answer + 4;
  while (set.size < n) { set.add(extra++); }
  return [...set];
}

/* ---------- Round flow ---------- */
function startRound(level) {
  audio(); sfx.tap();
  state.level = level;
  state.q = 0; state.score = 0;
  state.particles = []; state.messages = [];
  state.rocketX = 0.5; state.targetX = null;
  showScreen('play');
  nextQuestion();
}

function nextQuestion() {
  state.question = makeQuestion(state.level);
  state.triesThisQ = 0;
  state.nextAt = 0;
  $('question').textContent = state.question.text;
  $('progress').textContent = `Question ${state.q + 1} of ${CONFIG.questionsPerRound}`;
  renderDots();
  spawnWave();
}

function renderDots() {
  const dots = $('dots'); dots.innerHTML = '';
  for (let i = 0; i < CONFIG.questionsPerRound; i++) {
    const d = document.createElement('i');
    if (i < state.q) d.className = 'done'; else if (i === state.q) d.className = 'now';
    dots.appendChild(d);
  }
}

function spawnWave() {
  const n = CONFIG.starsAtOnce[state.level];
  const values = shuffle([state.question.answer, ...wrongAnswers(state.question.answer, n - 1)]);
  const lanes = shuffle([...Array(n).keys()]);
  const colors = shuffle([...CONFIG.starColors]);
  state.stars = values.map((v, i) => ({
    value: v,
    correct: v === state.question.answer,
    x: 0.1 + 0.8 * (lanes[i] + 0.5) / n,
    y: -0.05 - Math.random() * 0.18,
    spin: Math.random() * Math.PI * 2,
    color: colors[i % colors.length],
    alive: true,
  }));
}

function finishRound() {
  sfx.fanfare();
  const max = CONFIG.questionsPerRound * CONFIG.pointsFirstTry;
  const pct = state.score / max;
  const earned = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : 1;
  const best = loadBest(state.level);
  const isBest = state.score > best;
  if (isBest) saveBest(state.level, state.score);

  $('endTitle').textContent = earned === 3 ? 'Superstar!' : earned === 2 ? 'Great flying!' : 'Well done!';
  $('endScore').textContent = `You scored ${state.score} points`;
  $('endBest').textContent = isBest ? 'New best score!' : `Your best: ${best}`;
  const STAR = (on) => `<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z" fill="${on ? '#ffc21a' : '#e3dccb'}" stroke="${on ? '#e09a00' : '#cfc6b0'}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  $('endStars').innerHTML = [0, 1, 2].map(i => STAR(i < earned)).join('');
  for (let i = 0; i < 80; i++) burst(Math.random() * W, H * 0.3, 1, true);
  showScreen('end');
}

/* ---------- Screens ---------- */
function showScreen(name) {
  state.screen = name;
  $('menu').hidden = name !== 'menu';
  $('pauseScreen').hidden = name !== 'paused';
  $('endScreen').hidden = name !== 'end';
  const inGame = name === 'play' || name === 'paused';
  $('hud').hidden = !inGame;
  $('pads').hidden = name !== 'play';
  if (name === 'menu') refreshBestLabels();
  const focusMap = { menu: '[data-level="easy"]', paused: '#resumeBtn', end: '#againBtn' };
  if (focusMap[name]) setTimeout(() => document.querySelector(focusMap[name])?.focus({ preventScroll: true }), 50);
}
function pause() { if (state.screen === 'play') { showScreen('paused'); sfx.tap(); } }
function resume() { if (state.screen === 'paused') { showScreen('play'); sfx.tap(); } }

document.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => startRound(b.dataset.level)));
$('pauseBtn').addEventListener('click', pause);
$('resumeBtn').addEventListener('click', resume);
$('quitBtn').addEventListener('click', () => { sfx.tap(); state.stars = []; showScreen('menu'); });
$('againBtn').addEventListener('click', () => startRound(state.level));
$('levelBtn').addEventListener('click', () => { sfx.tap(); state.stars = []; showScreen('menu'); });
$('muteBtn').addEventListener('click', () => { setMuted(!state.muted); sfx.tap(); });
$('homeBtn').addEventListener('click', () => {
  if (document.referrer && history.length > 1) history.back(); else location.href = '../index.html';
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- Controls ---------- */
const held = { left: false, right: false };
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') { held.left = true; e.preventDefault(); }
  if (k === 'arrowright' || k === 'd') { held.right = true; e.preventDefault(); }
  if (k === 'p' || k === 'escape') { state.screen === 'play' ? pause() : resume(); }
  if (k === 'm') setMuted(!state.muted);
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') held.left = false;
  if (k === 'arrowright' || k === 'd') held.right = false;
});

let dragging = false;
canvas.addEventListener('pointerdown', e => { dragging = true; state.targetX = e.clientX / W; audio(); });
canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || dragging) state.targetX = e.clientX / W; });
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointercancel', () => { dragging = false; });

function bindPad(el, dir) {
  const on = e => { e.preventDefault(); state.padDir = dir; state.targetX = null; el.classList.add('held'); };
  const off = () => { if (state.padDir === dir) state.padDir = 0; el.classList.remove('held'); };
  el.addEventListener('pointerdown', on);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, off));
}
bindPad($('leftPad'), -1);
bindPad($('rightPad'), 1);

/* ---------- Effects ---------- */
function burst(x, y, count, confetti) {
  const n = reduceMotion ? Math.ceil(count / 3) : count;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (confetti ? 120 : 60) + Math.random() * 260;
    state.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (confetti ? 200 : 60),
      life: 1, decay: 0.6 + Math.random() * 0.6,
      size: 4 + Math.random() * 6, rot: Math.random() * 6,
      color: pick(['#ffd23f', '#ff6fae', '#3ee0c4', '#9b8cff', '#ffffff']),
      confetti,
    });
  }
}
function say(text, x, y, color) {
  state.messages.push({ text, x, y, color, life: 1 });
}

/* ---------- Game update ---------- */
function rocketY() { return H - Math.max(unit * 1.9, 150); }
function rocketSize() { return Math.max(unit * 0.95, 44); }
function starRadius() { return Math.max(unit * 0.62, 34); }

function update(dt) {
  state.time += dt;
  // particles & messages keep moving on every screen so the end confetti plays
  state.particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.vx *= 0.99; p.rot += dt * 6; p.life -= p.decay * dt; });
  state.particles = state.particles.filter(p => p.life > 0);
  state.messages.forEach(m => { m.y -= 40 * dt; m.life -= dt * 0.8; });
  state.messages = state.messages.filter(m => m.life > 0);
  if (state.wobble > 0) state.wobble = Math.max(0, state.wobble - dt);

  if (state.screen !== 'play') return;

  // move the rocket
  const dir = (held.right ? 1 : 0) - (held.left ? 1 : 0) || state.padDir;
  if (dir) { state.targetX = null; state.rocketX += dir * CONFIG.rocketSpeed * dt; }
  else if (state.targetX !== null) { state.rocketX += (state.targetX - state.rocketX) * Math.min(1, dt * 12); }
  state.rocketX = Math.max(0.06, Math.min(0.94, state.rocketX));

  // waiting between questions
  if (state.nextAt) {
    if (state.time >= state.nextAt) {
      state.q++;
      if (state.q >= CONFIG.questionsPerRound) finishRound(); else nextQuestion();
    }
    return;
  }

  // falling stars
  const speed = CONFIG.fallSpeed * (1 + state.q * CONFIG.speedUpPerQuestion);
  const rx = state.rocketX * W, ry = rocketY() - rocketSize() * 0.2;
  const hitDist = starRadius() + rocketSize() * 0.45;
  for (const s of state.stars) {
    if (!s.alive) continue;
    s.y += speed * dt;
    s.spin += dt * 1.5;
    const sx = s.x * W, sy = s.y * H;
    if (Math.hypot(sx - rx, sy - ry) < hitDist) catchStar(s, sx, sy);
  }

  // if the right star fell past the rocket, send the stars again
  const right = state.stars.find(s => s.correct);
  if (!state.nextAt && right && right.alive && right.y * H > H + starRadius()) {
    say("Let's try again!", W / 2, H * 0.45, '#ffffff');
    spawnWave();
  }
}

function catchStar(s, sx, sy) {
  s.alive = false;
  state.triesThisQ++;
  if (s.correct) {
    sfx.ding();
    state.score += state.triesThisQ === 1 ? CONFIG.pointsFirstTry : CONFIG.pointsLater;
    $('score').textContent = state.score;
    burst(sx, sy, 40, true);
    say(pick(CONFIG.cheers), sx, sy - 40, '#ffd23f');
    state.stars.forEach(o => { if (o.alive) { o.alive = false; burst(o.x * W, o.y * H, 6, false); } });
    state.nextAt = state.time + 0.9;
  } else {
    sfx.boop();
    state.wobble = 0.5;
    burst(sx, sy, 10, false);
    say(pick(CONFIG.oops), sx, sy - 40, '#ffffff');
  }
}

/* ---------- Drawing ---------- */
const bgStars = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + 0.4, p: Math.random() * 6 }));

function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a1240'); g.addColorStop(1, '#2a1b6e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of bgStars) {
    const a = reduceMotion ? 0.7 : 0.45 + 0.45 * Math.sin(t * 2 + s.p);
    ctx.globalAlpha = a; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // ringed planet
  const px = W * 0.86, py = H * 0.62, pr = Math.max(unit * 1.1, 40);
  ctx.fillStyle = '#ff8fc4'; ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(px - pr * 0.3, py - pr * 0.3, pr * 0.35, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = Math.max(4, pr * 0.12);
  ctx.beginPath(); ctx.ellipse(px, py, pr * 1.6, pr * 0.4, -0.35, 0, Math.PI * 2); ctx.stroke();
  // small green planet
  const qx = W * 0.12, qy = H * 0.42, qr = Math.max(unit * 0.55, 22);
  ctx.fillStyle = '#3ee0c4'; ctx.beginPath(); ctx.arc(qx, qy, qr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.arc(qx + qr * 0.3, qy + qr * 0.2, qr * 0.3, 0, Math.PI * 2); ctx.fill();
  // moon ground at the bottom
  ctx.fillStyle = '#3b2f8f';
  ctx.beginPath(); ctx.ellipse(W / 2, H + H * 0.05, W * 0.9, H * 0.12, 0, 0, Math.PI * 2); ctx.fill();
}

function starPath(cx, cy, R, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 ? r : R;
    const a = rot + i * Math.PI / 5 - Math.PI / 2;
    ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
  ctx.closePath();
}

function drawStar(s) {
  const R = starRadius(), x = s.x * W, y = s.y * H;
  const rot = reduceMotion ? 0 : Math.sin(s.spin) * 0.18;
  ctx.save();
  ctx.shadowColor = s.color; ctx.shadowBlur = 18;
  ctx.fillStyle = s.color;
  starPath(x, y, R * 1.15, R * 0.6, rot); ctx.fill();
  ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(42,33,96,.35)';
  starPath(x, y, R * 1.15, R * 0.6, rot); ctx.stroke();
  ctx.fillStyle = '#2a2160';
  ctx.font = `700 ${Math.round(R * (String(s.value).length > 1 ? 0.72 : 0.85))}px Fredoka, "Comic Sans MS", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s.value, x, y + R * 0.06);
}

function drawRocket(x, y, s, t) {
  ctx.save();
  ctx.translate(x, y);
  if (state.wobble > 0 && !reduceMotion) ctx.rotate(Math.sin(state.wobble * 40) * 0.18 * state.wobble);
  // flame
  const fl = s * (0.55 + 0.18 * Math.sin(t * 28));
  ctx.fillStyle = '#ff8a1c';
  ctx.beginPath(); ctx.moveTo(-s * 0.26, s * 0.55); ctx.quadraticCurveTo(0, s * 0.55 + fl * 1.5, s * 0.26, s * 0.55); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.moveTo(-s * 0.14, s * 0.55); ctx.quadraticCurveTo(0, s * 0.55 + fl, s * 0.14, s * 0.55); ctx.fill();
  // fins
  ctx.fillStyle = '#e8457a';
  ctx.beginPath(); ctx.moveTo(-s * 0.28, s * 0.05); ctx.lineTo(-s * 0.62, s * 0.62); ctx.lineTo(-s * 0.26, s * 0.5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s * 0.28, s * 0.05); ctx.lineTo(s * 0.62, s * 0.62); ctx.lineTo(s * 0.26, s * 0.5); ctx.fill();
  // body
  ctx.fillStyle = '#f5f7ff';
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.95);
  ctx.bezierCurveTo(s * 0.48, -s * 0.5, s * 0.42, s * 0.3, s * 0.3, s * 0.6);
  ctx.lineTo(-s * 0.3, s * 0.6);
  ctx.bezierCurveTo(-s * 0.42, s * 0.3, -s * 0.48, -s * 0.5, 0, -s * 0.95);
  ctx.fill();
  // nose
  ctx.fillStyle = '#e8457a';
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.95);
  ctx.bezierCurveTo(s * 0.26, -s * 0.75, s * 0.33, -s * 0.6, s * 0.36, -s * 0.52);
  ctx.lineTo(-s * 0.36, -s * 0.52);
  ctx.bezierCurveTo(-s * 0.33, -s * 0.6, -s * 0.26, -s * 0.75, 0, -s * 0.95);
  ctx.fill();
  // window
  ctx.fillStyle = '#3ee0c4'; ctx.strokeStyle = '#2a2160'; ctx.lineWidth = Math.max(3, s * 0.06);
  ctx.beginPath(); ctx.arc(0, -s * 0.12, s * 0.18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath(); ctx.arc(-s * 0.06, -s * 0.18, s * 0.05, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw(t) {
  drawBackground(t);
  if (state.screen === 'play' || state.screen === 'paused') {
    state.stars.forEach(s => { if (s.alive) drawStar(s); });
    drawRocket(state.rocketX * W, rocketY(), rocketSize(), t);
  }
  for (const p of state.particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    if (p.confetti) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for (const m of state.messages) {
    ctx.globalAlpha = Math.min(1, m.life * 2);
    ctx.font = `700 ${Math.round(Math.max(unit * 0.5, 26))}px Fredoka, "Comic Sans MS", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(20,16,60,.8)';
    const x = Math.max(90, Math.min(W - 90, m.x));
    ctx.strokeText(m.text, x, m.y); ctx.fillStyle = m.color; ctx.fillText(m.text, x, m.y);
  }
  ctx.globalAlpha = 1;
}

/* ---------- Main loop ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw(now / 1000);
  requestAnimationFrame(loop);
}
showScreen('menu');
requestAnimationFrame(loop);
</script>
</body>
</html>
