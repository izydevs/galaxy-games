<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logic Lights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700&display=swap">
<style>
  /* Layout: header, level strip, square light grid in the centre, controls and rules beneath */
  :root {
    --bg: #07121c; --panel: #0f2030; --line: #1f3a52; --text: #e7f4ff; --muted: #8fb0c9;
    --on: #ffe066; --on-glow: rgba(255,224,102,.65); --off: #13293b; --hint: #ff5fd2; --accent: #ffe066;
    --display: "Orbitron", "Arial Black", sans-serif; --body: "Inter", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--hint); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .top { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
  .top h1 { flex: 1; margin: 0; font-family: var(--display); font-size: clamp(20px, 4.5vw, 28px); text-align: center; letter-spacing: .06em; }
  .icon { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); display: grid; place-items: center; flex: none; }
  .icon svg { width: 20px; height: 20px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
  .levels { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .lv { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-family: var(--display); font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; min-width: 0; }
  .lv small { font-size: 8px; color: var(--accent); letter-spacing: 1px; }
  .lv[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .lv:disabled { opacity: .3; cursor: not-allowed; }
  .info { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
  .info h2 { margin: 0; font-family: var(--display); font-size: 18px; }
  .info span { color: var(--muted); }
  .grid { display: grid; gap: clamp(6px, 1.8vw, 10px); width: min(100%, 420px); margin: 0 auto; padding: clamp(8px, 2vw, 14px); background: #0a1824; border-radius: 18px; border: 1px solid var(--line); }
  .light { aspect-ratio: 1; border: none; border-radius: 22%; background: var(--off); display: grid; place-items: center; transition: background .15s, box-shadow .15s; padding: 0; }
  .light svg { width: 46%; height: 46%; opacity: .25; color: #6c8aa3; }
  .light.on { background: radial-gradient(circle at 40% 35%, #fff6c2, var(--on) 55%, #e0b400); box-shadow: 0 0 18px var(--on-glow); }
  .light.on svg { opacity: .9; color: #6b4e00; }
  .light.hint { box-shadow: 0 0 0 4px var(--hint), 0 0 18px var(--hint); }
  .row { display: flex; gap: 8px; }
  .btn { flex: 1; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); font-weight: 700; font-size: 15px; }
  .btn.go { background: var(--accent); color: #2a2000; border: none; font-family: var(--display); }
  .msg { margin: 0; min-height: 1.4em; text-align: center; font-weight: 700; }
  .rules { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .rules b { color: var(--text); }
  @media (prefers-reduced-motion: reduce) { .light { transition: none; } }
</style>
<!-- Google AdSense Auto ads. Ads are non-personalised because players are children. -->
<script>(window.adsbygoogle = window.adsbygoogle || []).requestNonPersonalizedAds = 1;</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3300499092175001" crossorigin="anonymous"></script>
</head>
<body>
<header class="top">
  <button class="icon" id="home" aria-label="All games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
  <h1>LOGIC LIGHTS</h1>
  <button class="icon" id="mute"></button>
</header>

<main class="wrap">
  <div class="levels" id="levels" aria-label="Levels"></div>
  <div class="info"><h2 id="title">Level 1</h2><span>Moves <b id="moves">0</b> · Par <b id="par">0</b></span></div>
  <div class="grid" id="grid" role="grid" aria-label="Lights"></div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div class="row">
    <button class="btn" id="hintBtn">Hint</button>
    <button class="btn" id="reset">Restart</button>
    <button class="btn go" id="next" hidden>NEXT</button>
  </div>
  <p class="rules"><b>Goal:</b> switch every light off. Pressing a light flips it <b>and</b> the lights above, below, left and right of it. Lit squares show a sun; dark squares show a moon. Finish within par moves for 3 stars. Using a hint caps you at 2 stars.</p>
</main>

<script>
/* ---------- Settings you can change ---------- */
const LEVEL_COUNT = 16;
const sizeFor = lv => lv < 3 ? 3 : lv < 7 ? 4 : 5;      // grid size by level (0-based)
const pressesFor = lv => Math.min(2 + lv, 12);          // how scrambled each level is

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let muted = store.get('kidsGames.muted', false), AC;
function tone(f, d = 0.1, type = 'sine', v = 0.08, delay = 0) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.05);
  } catch (e) {}
}
const ICON_ON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
function setMute(m) { muted = m; $('mute').innerHTML = m ? ICON_OFF : ICON_ON; $('mute').setAttribute('aria-label', m ? 'Turn sound on' : 'Mute sound'); store.set('kidsGames.muted', m); }
$('mute').onclick = () => setMute(!muted); setMute(muted);
$('home').onclick = () => { if (document.referrer && history.length > 1) history.back(); else location.href = '../index.html'; };
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';

/* ---------- Game ---------- */
// The puzzle is made by pressing random lights on a dark board. Pressing the same set again
// turns everything off, so (scramble XOR your presses) is always a valid solution: that is the hint.
let lv = 0, n = 3, on = [], need = new Set(), moves = 0, par = 0, hinted = false, solved = false, snapshot = null;
const stars = () => store.get('logicLights.stars', {});

function flip(i) {
  const x = i % n, y = Math.floor(i / n);
  [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < n && ny < n) on[ny * n + nx] = !on[ny * n + nx];
  });
}

function load(i, keepBoard = false) {
  lv = i; n = sizeFor(i); moves = 0; hinted = false; solved = false;
  if (!keepBoard) {
    do {
      on = Array(n * n).fill(false); need = new Set();
      while (need.size < Math.min(pressesFor(i), n * n - 1)) need.add(Math.floor(Math.random() * n * n));
      need.forEach(flip);
    } while (on.every(v => !v));
    snapshot = { on: [...on], need: new Set(need) };
  } else { on = [...snapshot.on]; need = new Set(snapshot.need); }
  par = need.size;
  $('title').textContent = `Level ${i + 1} · ${n}×${n}`;
  $('par').textContent = par; $('msg').textContent = ''; $('next').hidden = true;
  render(); renderLevels();
}

function render(hintAt = -1) {
  const g = $('grid');
  g.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  g.innerHTML = on.map((v, i) => `<button class="light ${v ? 'on' : ''} ${i === hintAt ? 'hint' : ''}" data-i="${i}" aria-label="Row ${Math.floor(i / n) + 1}, column ${i % n + 1}, ${v ? 'on' : 'off'}">${v ? SUN : MOON}</button>`).join('');
  $('moves').textContent = moves;
}

function renderLevels() {
  const st = stars(), unlocked = Math.max(-1, ...Object.keys(st).map(Number)) + 1;
  $('levels').innerHTML = Array.from({ length: LEVEL_COUNT }, (_, i) => `<button class="lv" data-lv="${i}" ${i > unlocked ? 'disabled' : ''} aria-current="${i === lv}" aria-label="Level ${i + 1}">${i + 1}<small>${st[i] ? '★'.repeat(st[i]) : ''}</small></button>`).join('');
}

$('grid').addEventListener('click', e => {
  const b = e.target.closest('.light'); if (!b || solved) return;
  const i = +b.dataset.i;
  flip(i); moves++;
  if (need.has(i)) need.delete(i); else need.add(i);
  tone(on[i] ? 660 : 440, 0.07);
  render();
  if (on.every(v => !v)) win();
});

function win() {
  solved = true;
  const s = Math.min(hinted ? 2 : 3, moves <= par ? 3 : moves <= par + 4 ? 2 : 1);
  const st = stars(); st[lv] = Math.max(st[lv] || 0, s); store.set('logicLights.stars', st);
  [523, 659, 784, 1047].forEach((f, k) => tone(f, 0.2, 'triangle', 0.1, k * 0.1));
  $('msg').textContent = `${'★'.repeat(s)}${'☆'.repeat(3 - s)} All dark in ${moves} moves!` + (lv === LEVEL_COUNT - 1 ? ' You beat every level!' : '');
  $('next').hidden = lv >= LEVEL_COUNT - 1;
  renderLevels();
}

$('hintBtn').onclick = () => {
  if (solved || !need.size) return;
  hinted = true;
  const pickOne = [...need][0];
  render(pickOne);
  $('msg').textContent = 'Try pressing the glowing pink square.';
};
$('reset').onclick = () => load(lv, true);
$('next').onclick = () => load(lv + 1);
$('levels').addEventListener('click', e => { const b = e.target.closest('[data-lv]'); if (b && !b.disabled) load(+b.dataset.lv); });

const done = Object.keys(stars()).length;
load(Math.min(done, LEVEL_COUNT - 1));
</script>
</body>
</html>
