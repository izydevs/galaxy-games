<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700&display=swap">
<style>
  /* Layout: header, level picker, then maze grid beside the program editor (stacked on phones) */
  :root {
    --bg: #0c1a1f; --panel: #13262d; --line: #24444f; --text: #e6fbff; --muted: #8fb5bf;
    --floor: #1b3640; --wall: #3c5a64; --goal: #ffd23f; --gem: #ff5fd2; --robot: #3ee0c4;
    --fwd: #3b82f6; --left: #f59e0b; --right: #a855f7; --accent: #3ee0c4;
    --display: "Orbitron", "Arial Black", sans-serif; --body: "Inter", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .top { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
  .top h1 { flex: 1; margin: 0; font-family: var(--display); font-size: clamp(20px, 4.5vw, 28px); text-align: center; letter-spacing: .06em; }
  .icon { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); display: grid; place-items: center; flex: none; }
  .icon svg { width: 20px; height: 20px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
  .levels { display: flex; gap: 6px; flex-wrap: wrap; }
  .lv { width: 46px; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-family: var(--display); font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 15px; }
  .lv small { font-size: 9px; color: var(--goal); letter-spacing: 1px; }
  .lv[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .lv:disabled { opacity: .35; cursor: not-allowed; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 760px) { .main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  h2 { margin: 0; font-family: var(--display); font-size: 16px; letter-spacing: .06em; }
  .goal { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .maze { position: relative; display: grid; gap: 3px; width: 100%; max-width: 440px; margin: 0 auto; }
  .cell { aspect-ratio: 1; border-radius: 6px; background: var(--floor); display: grid; place-items: center; position: relative; }
  .cell.wall { background: var(--wall); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
  .cell svg { width: 60%; height: 60%; }
  .robot { position: absolute; display: grid; place-items: center; transition: left .28s, top .28s, transform .28s; pointer-events: none; }
  .robot svg { width: 72%; height: 72%; filter: drop-shadow(0 0 8px rgba(62,224,196,.6)); }
  .robot.bump { animation: bump .3s; }
  @keyframes bump { 50% { filter: drop-shadow(0 0 12px #ff4d6d); } }
  .palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cmd { min-height: 52px; border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .cmd svg { width: 20px; height: 20px; flex: none; }
  .c-F { background: var(--fwd); } .c-L { background: var(--left); color: #1d1200; } .c-R { background: var(--right); }
  .program { display: flex; flex-wrap: wrap; gap: 6px; min-height: 92px; padding: 10px; border-radius: 10px; background: #0b1a1f; border: 1px dashed var(--line); align-content: flex-start; }
  .program .empty { color: var(--muted); font-size: 14px; margin: auto; text-align: center; }
  .chip { min-width: 46px; height: 40px; border: none; border-radius: 8px; color: #fff; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; }
  .chip svg { width: 16px; height: 16px; }
  .chip.c-L { color: #1d1200; }
  .chip.running { outline: 3px solid #fff; transform: translateY(-2px); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { flex: 1 1 100px; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--text); font-weight: 700; font-size: 15px; }
  .btn.go { background: var(--accent); color: #062420; border: none; font-family: var(--display); letter-spacing: .06em; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .msg { margin: 0; min-height: 1.4em; font-weight: 600; }
  .msg.good { color: var(--accent); } .msg.bad { color: #ff8fa3; }
  .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .robot { transition: none; } }
</style>
<!-- Google AdSense Auto ads. Ads are non-personalised because players are children. -->
<script>(window.adsbygoogle = window.adsbygoogle || []).requestNonPersonalizedAds = 1;</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3300499092175001" crossorigin="anonymous"></script>
</head>
<body>
<header class="top">
  <button class="icon" id="home" aria-label="All games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
  <h1>CODE QUEST</h1>
  <button class="icon" id="mute"></button>
</header>

<main class="wrap">
  <div class="levels" id="levels" aria-label="Levels"></div>
  <div class="main">
    <section class="card">
      <h2 id="lvTitle">Level 1</h2>
      <p class="goal" id="goal"></p>
      <div class="maze" id="maze"></div>
    </section>
    <section class="card">
      <h2>Your program</h2>
      <p class="goal">Tap the blocks to add commands. Tap a command in your program to remove it.</p>
      <div class="palette">
        <button class="cmd c-F" data-cmd="F"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M5 11l7-7 7 7"/></svg>Forward</button>
        <button class="cmd c-L" data-cmd="L"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/></svg>Turn left</button>
        <button class="cmd c-R" data-cmd="R"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0-6 6v5"/></svg>Turn right</button>
      </div>
      <div class="program" id="program" aria-live="polite"></div>
      <span class="count" id="count"></span>
      <div class="row">
        <button class="btn go" id="run">RUN</button>
        <button class="btn" id="undo">Undo</button>
        <button class="btn" id="clear">Clear</button>
      </div>
      <p class="msg" id="msg" aria-live="polite"></p>
      <button class="btn go" id="next" hidden>NEXT LEVEL</button>
    </section>
  </div>
</main>

<script>
/* ---------- Levels: # wall, . floor, S start, G goal, * gem. Add more below. ---------- */
const LEVELS = [
  { tip: 'Move the robot to the gold star.', map: ['.....', '.....', 'S...G', '.....', '.....'] },
  { tip: 'Robots only go where they face. Turn first!', map: ['#####', '#...G', '#.###', '#S###', '#####'] },
  { tip: 'Plan the whole path before you press Run.', map: ['S..#.', '##.#.', '...#.', '.###.', '....G'] },
  { tip: 'Collect every pink gem before reaching the star.', map: ['S.*..', '####.', 'G.*..'] },
  { tip: 'Long way round!', map: ['.....#', '.###.#', '.#G#.#', '.#.#..', 'S#...#'] },
  { tip: 'Three gems, one star.', map: ['*...*', '.###.', '.#G#.', '.#.#.', 'S...*'] },
  { tip: 'Find the way through the walls.', map: ['S.#...', '..#.#.', '..#.#G', '..#.#.', '......', '*.....'] },
  { tip: 'You can walk over the star before you have every gem.', map: ['######', '#S..*#', '####.#', '#G...#', '#*####', '######'] },
  { tip: 'Gems on every side.', map: ['..*..', '.#.#.', '*.S.*', '.#.#.', '..G..'] },
  { tip: 'The final maze. Count carefully!', map: ['S.....#', '#####.#', '*.....#', '.######', '.....*.', '#####.#', 'G.....#'] },
];
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // up, right, down, left
const STEP_MS = 330;

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let muted = store.get('kidsGames.muted', false), AC;
function tone(f, d = 0.1, type = 'square', v = 0.05, delay = 0) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.05);
  } catch (e) {}
}
const ICON_ON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
function setMute(m) { muted = m; $('mute').innerHTML = m ? ICON_OFF : ICON_ON; $('mute').setAttribute('aria-label', m ? 'Turn sound on' : 'Mute sound'); store.set('kidsGames.muted', m); }
$('mute').onclick = () => setMute(!muted); setMute(muted);
$('home').onclick = () => { if (document.referrer && history.length > 1) history.back(); else location.href = '../index.html'; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

const SVG_STAR = '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z" fill="#ffd23f"/></svg>';
const SVG_GEM = '<svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#ff5fd2"/><path d="M2 9h20M9 3l3 18M15 3l-3 18" stroke="#7a1e66" stroke-width="1" fill="none"/></svg>';
const SVG_ROBOT = '<svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="12" rx="3" fill="#3ee0c4"/><path d="M12 1l4 5H8z" fill="#ffffff"/><circle cx="9.5" cy="12" r="1.8" fill="#062420"/><circle cx="14.5" cy="12" r="1.8" fill="#062420"/><rect x="9" y="15.5" width="6" height="1.6" rx=".8" fill="#062420"/></svg>';
const CMD_ICON = { F: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M5 11l7-7 7 7"/></svg>', L: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/></svg>', R: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0-6 6v5"/></svg>' };
const CMD_NAME = { F: 'Forward', L: 'Left', R: 'Right' };
const MAX_BLOCKS = 40;

/* ---------- Level parsing + shortest program (for star rating) ---------- */
function parse(lv) {
  const map = lv.map, h = map.length, w = map[0].length, gems = [];
  let start, goal;
  map.forEach((row, y) => [...row].forEach((c, x) => { if (c === 'S') start = { x, y }; if (c === 'G') goal = { x, y }; if (c === '*') gems.push({ x, y }); }));
  return { map, w, h, start, goal, gems, wall: (x, y) => x < 0 || y < 0 || x >= w || y >= h || map[y][x] === '#' };
}
function shortest(L) {
  const full = (1 << L.gems.length) - 1;
  const gemAt = (x, y) => L.gems.findIndex(g => g.x === x && g.y === y);
  const key = s => `${s.x},${s.y},${s.d},${s.m}`;
  const q = [{ x: L.start.x, y: L.start.y, d: 1, m: 0, n: 0 }], seen = new Set([key(q[0])]);
  while (q.length) {
    const s = q.shift();
    if (s.x === L.goal.x && s.y === L.goal.y && s.m === full) return s.n;
    const nexts = [{ ...s, d: (s.d + 3) % 4 }, { ...s, d: (s.d + 1) % 4 }];
    const nx = s.x + DIRS[s.d][0], ny = s.y + DIRS[s.d][1];
    if (!L.wall(nx, ny)) { const g = gemAt(nx, ny); nexts.push({ ...s, x: nx, y: ny, m: g >= 0 ? s.m | (1 << g) : s.m }); }
    for (const t of nexts) { t.n = s.n + 1; const k = key(t); if (!seen.has(k)) { seen.add(k); q.push(t); } }
  }
  return null;
}

/* ---------- Game ---------- */
let li = 0, L = null, prog = [], running = false, robot = null, best = shortest(parse(LEVELS[0]));
const progress = () => store.get('codeQuest.stars', {});

function renderLevels() {
  const st = progress();
  const unlocked = Math.max(-1, ...Object.keys(st).map(Number)) + 1;
  $('levels').innerHTML = LEVELS.map((_, i) => `<button class="lv" data-lv="${i}" ${i > unlocked ? 'disabled' : ''} aria-current="${i === li}" aria-label="Level ${i + 1}${st[i] ? ', ' + st[i] + ' stars' : ''}">${i + 1}<small>${st[i] ? '★'.repeat(st[i]) : ''}</small></button>`).join('');
}

function load(i) {
  li = i; L = parse(LEVELS[i]); best = shortest(L); prog = []; running = false;
  $('lvTitle').textContent = `Level ${i + 1}`;
  $('goal').textContent = LEVELS[i].tip + ` The robot starts facing right. Best solution: ${best} blocks.`;
  $('msg').textContent = ''; $('msg').className = 'msg'; $('next').hidden = true;
  resetRobot(); renderProgram(); renderLevels();
}

function resetRobot() {
  robot = { x: L.start.x, y: L.start.y, d: 1, got: new Set(), spin: 90 };
  drawMaze();
}

function drawMaze() {
  const m = $('maze');
  m.style.gridTemplateColumns = `repeat(${L.w}, 1fr)`;
  m.innerHTML = L.map.map((row, y) => [...row].map((c, x) => {
    const gemIdx = L.gems.findIndex(g => g.x === x && g.y === y);
    const inner = c === 'G' ? SVG_STAR : gemIdx >= 0 && !robot.got.has(gemIdx) ? SVG_GEM : '';
    return `<div class="cell ${c === '#' ? 'wall' : ''}" aria-label="${c === '#' ? 'wall' : c === 'G' ? 'star' : inner ? 'gem' : 'floor'}">${inner}</div>`;
  }).join('')).join('') + `<div class="robot" id="robot" aria-label="robot">${SVG_ROBOT}</div>`;
  placeRobot();
}
function placeRobot() {
  const r = $('robot'), cell = $('maze').children[robot.y * L.w + robot.x];
  r.style.left = cell.offsetLeft + 'px'; r.style.top = cell.offsetTop + 'px';
  r.style.width = cell.offsetWidth + 'px'; r.style.height = cell.offsetHeight + 'px';
  r.style.transform = `rotate(${robot.spin - 90}deg)`;
}
addEventListener('resize', () => { if (robot) placeRobot(); });

function renderProgram(active = -1) {
  $('program').innerHTML = prog.length
    ? prog.map((c, i) => `<button class="chip c-${c} ${i === active ? 'running' : ''}" data-i="${i}" aria-label="Step ${i + 1}: ${CMD_NAME[c]}. Tap to remove.">${CMD_ICON[c]}${i + 1}</button>`).join('')
    : '<span class="empty">Your program is empty. Add some blocks!</span>';
  $('count').textContent = `${prog.length} block${prog.length === 1 ? '' : 's'} · best possible: ${best}`;
  ['run', 'undo', 'clear'].forEach(id => $(id).disabled = running || !prog.length);
  document.querySelectorAll('[data-cmd]').forEach(b => b.disabled = running);
}

document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => {
  if (running || prog.length >= MAX_BLOCKS) return;
  prog.push(b.dataset.cmd); tone(500, 0.05); renderProgram();
});
$('program').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c || running) return; prog.splice(+c.dataset.i, 1); renderProgram(); });
$('undo').onclick = () => { prog.pop(); renderProgram(); };
$('clear').onclick = () => { prog = []; resetRobot(); renderProgram(); $('msg').textContent = ''; };

async function run() {
  if (running || !prog.length) return;
  running = true; resetRobot(); $('msg').textContent = 'Running…'; $('msg').className = 'msg';
  renderProgram(); await sleep(250);
  for (let i = 0; i < prog.length; i++) {
    renderProgram(i);
    const c = prog[i];
    if (c === 'L') { robot.d = (robot.d + 3) % 4; robot.spin -= 90; tone(440, 0.06); }
    else if (c === 'R') { robot.d = (robot.d + 1) % 4; robot.spin += 90; tone(520, 0.06); }
    else {
      const nx = robot.x + DIRS[robot.d][0], ny = robot.y + DIRS[robot.d][1];
      if (L.wall(nx, ny)) {
        $('robot').classList.add('bump'); tone(150, 0.25, 'sawtooth', 0.08);
        return fail(`Bump! Step ${i + 1} walks into a wall. Fix it and try again.`);
      }
      robot.x = nx; robot.y = ny; tone(660, 0.05);
      const g = L.gems.findIndex(p => p.x === nx && p.y === ny);
      if (g >= 0 && !robot.got.has(g)) { robot.got.add(g); tone(1046, 0.12, 'triangle', 0.1); drawMaze(); }
    }
    placeRobot();
    await sleep(STEP_MS);
  }
  const atGoal = robot.x === L.goal.x && robot.y === L.goal.y;
  if (atGoal && robot.got.size === L.gems.length) return win();
  if (atGoal) return fail(`You reached the star but still need ${L.gems.length - robot.got.size} gem${L.gems.length - robot.got.size > 1 ? 's' : ''}.`);
  fail('The program ended before the robot reached the star. Add more blocks!');
}
function fail(text) {
  running = false; $('msg').textContent = text; $('msg').className = 'msg bad'; renderProgram();
  setTimeout(() => $('robot')?.classList.remove('bump'), 400);
}
function win() {
  running = false;
  const stars = prog.length <= best ? 3 : prog.length <= best + 3 ? 2 : 1;
  const st = progress(); st[li] = Math.max(st[li] || 0, stars); store.set('codeQuest.stars', st);
  [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.1, i * 0.1));
  $('msg').className = 'msg good';
  $('msg').textContent = `${'★'.repeat(stars)}${'☆'.repeat(3 - stars)} Solved with ${prog.length} blocks.` + (stars < 3 ? ` Can you do it in ${best}?` : ' Perfect code!');
  $('next').hidden = li >= LEVELS.length - 1;
  if (li >= LEVELS.length - 1) $('msg').textContent += ' You finished every level!';
  renderProgram(); renderLevels();
}
$('run').onclick = run;
$('next').onclick = () => load(li + 1);
$('levels').addEventListener('click', e => { const b = e.target.closest('[data-lv]'); if (b && !b.disabled && !running) load(+b.dataset.lv); });
addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') { e.preventDefault(); document.querySelector('[data-cmd="F"]').click(); }
  if (e.key === 'ArrowLeft') document.querySelector('[data-cmd="L"]').click();
  if (e.key === 'ArrowRight') document.querySelector('[data-cmd="R"]').click();
  if (e.key === 'Backspace' && !running && prog.length) { prog.pop(); renderProgram(); }
  if (e.key === 'Enter' && document.activeElement?.tagName !== 'BUTTON') run();
});
const startAt = Math.min(LEVELS.length - 1, Object.keys(progress()).length);
load(startAt);
</script>
</body>
</html>
